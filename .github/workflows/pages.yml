name: Deploy to GitHub Pages

# Publishes the repository root as a static site.
#
# ONE-TIME SETUP: enable Pages for this repository at
# Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Until that is done every run fails at configure-pages with "Get Pages site
# failed ... Not Found". The action's `enablement: true` option does not help:
# creating a Pages site needs admin rights that the workflow's GITHUB_TOKEN
# does not have, so it fails with "Resource not accessible by integration".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
