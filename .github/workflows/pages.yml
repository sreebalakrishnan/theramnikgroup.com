name: Deploy to GitHub Pages

# Publishes the repository root as a static site. `enablement: true` below means
# the workflow creates the Pages site on first run, so there is nothing to switch
# on by hand in Settings → Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # enablement creates the Pages site if it does not exist yet; without it the
      # first run fails with "Get Pages site failed ... Not Found".
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
